name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      java_major:
        description: Temurin major for stripped-keycloak (21 or 25). Operator stays 25.
        required: false
        default: "21"
      dry_run:
        description: Build without pushing
        required: false
        default: "false"

# GITHUB_TOKEN is enough for GHCR. Base layers still come from docker.io
# (see Containerfile ARG ALPINE_IMAGE). Do not retarget those pulls.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  # CVE-2026-18963 (CVSS 9.1): unauthenticated account takeover via
  # reset-credentials flow bypass. Fixed in 26.7.2. Do not publish older.
  # https://github.com/keycloak/keycloak/issues/51833
  KEYCLOAK_VERSION: "26.7.2"

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.rel.outputs.image_tag }}
      prerelease: ${{ steps.rel.outputs.prerelease }}
    steps:
      - name: Resolve channel
        id: rel
        run: |
          set -eu
          version="${KEYCLOAK_VERSION}"
          image_tag="$version"
          prerelease=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            case "$tag" in
              *pre*|*rc*|*alpha*|*beta*)
                prerelease=true
                image_tag="$tag"
                ;;
            esac
          fi
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag} prerelease=${prerelease}"

  publish:
    needs: channel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: keycloak
            image: stripped-keycloak
            file: keycloak/Containerfile
            context: .
            java_major: "21"
          - id: operator
            image: stripped-keycloak-operator
            file: operator/Containerfile
            context: .
            java_major: "25"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard CVE-2026-18963
        run: |
          python3 - <<'PY'
          import os, sys
          v = os.environ["KEYCLOAK_VERSION"]
          try:
              parts = [int(p) for p in v.split(".")]
          except ValueError:
              print(f"Refusing KEYCLOAK_VERSION={v}: not X.Y.Z", file=sys.stderr)
              sys.exit(1)
          if parts < [26, 7, 2]:
              print(
                  f"Refusing KEYCLOAK_VERSION={v}: CVE-2026-18963 is unfixed below 26.7.2",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"KEYCLOAK_VERSION={v} includes the CVE-2026-18963 fix")
          PY

      - name: Resolve Java major
        id: java
        run: |
          if [ "${{ matrix.id }}" = "keycloak" ] && [ -n "${{ github.event.inputs.java_major }}" ]; then
            echo "major=${{ github.event.inputs.java_major }}" >> "$GITHUB_OUTPUT"
          else
            echo "major=${{ matrix.java_major }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.channel.outputs.image_tag }}
            type=raw,value=${{ needs.channel.outputs.image_tag }}-alpine-jlink
            type=raw,value=${{ needs.channel.outputs.image_tag }}-jdk${{ steps.java.outputs.major }}
            type=raw,value=latest,enable=${{ needs.channel.outputs.prerelease == 'false' && ((matrix.id == 'keycloak' && steps.java.outputs.major == '21') || matrix.id == 'operator') }}
            type=sha,prefix=${{ needs.channel.outputs.image_tag }}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/yet-another-solutions/stripped-keycloak
            org.opencontainers.image.licenses=Apache-2.0 AND GPL-2.0-only AND GPL-2.0-with-classpath-exception AND MIT
          provenance: true
          sbom: true
          build-args: |
            JAVA_MAJOR=${{ steps.java.outputs.major }}
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
            RELATED_IMAGE_KEYCLOAK=${{ env.REGISTRY }}/${{ env.OWNER }}/stripped-keycloak:${{ needs.channel.outputs.image_tag }}
            KC_DB=postgres
            KC_HEALTH_ENABLED=true
            KC_METRICS_ENABLED=true
            KC_CACHE=local
          cache-from: type=gha,scope=publish-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.id }}

  manifests:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [channel, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and rewrite operator YAML
        env:
          OWNER: ${{ env.OWNER }}
          REGISTRY: ${{ env.REGISTRY }}
          KEYCLOAK_VERSION: ${{ env.KEYCLOAK_VERSION }}
          IMAGE_TAG: ${{ needs.channel.outputs.image_tag }}
        run: scripts/rewrite-operator-manifests.sh
      - name: Pack kustomize dir
        env:
          IMAGE_TAG: ${{ needs.channel.outputs.image_tag }}
        run: |
          tar -C dist -czf "dist/stripped-keycloak-operator-manifests-${IMAGE_TAG}.tar.gz" operator-manifests
      - name: Attach manifests to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stripped-keycloak-operator-install-${{ needs.channel.outputs.image_tag }}.yml
            dist/stripped-keycloak-operator-manifests-${{ needs.channel.outputs.image_tag }}.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.channel.outputs.prerelease == 'true' }}
